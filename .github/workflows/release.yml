name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（不含 v 前缀，如 1.0.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Install vendored dependencies
        run: |
          shopt -s nullglob
          jars=(libs/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "::error::libs/ 下未找到依赖 jar；org.rtklib 未发布到公共仓库，构建无法解析该依赖"
            exit 1
          fi
          for jar in "${jars[@]}"; do
            pom="${jar%.jar}.pom"
            if [ ! -f "$pom" ]; then
              echo "::error::缺少与 $jar 同名的 pom 文件：$pom"
              exit 1
            fi
            echo "安装 $jar"
            mvn -B -q install:install-file -Dfile="$jar" -DpomFile="$pom"
          done

      - name: Resolve tag and version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          VERSION="$(echo "$VERSION" | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "::error::无法解析版本号（事件=$EVENT_NAME，ref=$GITHUB_REF）"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*([-._][0-9A-Za-z._-]+)?$'; then
            echo "::error::版本号格式非法：[$VERSION]。应为 1.0.0 或 1.0.0-rc1 之类，且不含 v 前缀"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "标签 $TAG_NAME 已存在，跳过创建"
          else
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
            echo "已创建并推送标签 $TAG_NAME"
          fi

      - name: Align pom version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          POM_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout -Dstyle.color=never | tail -n1)
          echo "pom.xml 版本：$POM_VERSION，标签版本：$VERSION"
          if [ "$POM_VERSION" = "$VERSION" ]; then
            echo "版本已一致，无需调整"
          elif [ "$POM_VERSION" = "$VERSION-SNAPSHOT" ]; then
            echo "pom.xml 为 SNAPSHOT，发布构建时去除 SNAPSHOT 后缀"
            mvn -B org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
              -DnewVersion="$VERSION" \
              -DgenerateBackupPoms=false \
              -DprocessAllModules=true
          else
            echo "::error::版本不一致：pom.xml=$POM_VERSION，标签=$VERSION。请先将 pom.xml 版本改为 $VERSION 后再发布"
            exit 1
          fi

      - name: Package
        run: mvn -B -e package -DskipTests

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            ignav-contract/target/ignav-contract-*.jar
            ignav-ins/target/ignav-ins-*.jar
            ignav-gnss/target/ignav-gnss-*.jar
            ignav-fusion/target/ignav-fusion-*.jar
            ignav-app/target/ignav-app-*.jar